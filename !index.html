<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>IA Image Generator</title>
    <style>
        /* Stile moderno e pulito */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f2f5; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center;
            width: 90%;
            max-width: 500px;
        }
        textarea { 
            width: 100%; 
            height: 100px; 
            padding: 15px; 
            border: 2px solid #ddd; 
            border-radius: 10px; 
            font-size: 16px; 
            resize: none;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        #imageContainer { margin-top: 25px; min-height: 200px; }
        img { 
            max-width: 100%; 
            border-radius: 10px; 
            display: none; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .loading { display: none; color: #555; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>Cosa vuoi generare?</h2>
    
    <textarea id="promptInput" placeholder="Descrivi la tua immagine qui... (es. Un astronauta che cavalca un dinosauro)"></textarea>
    
    <button onclick="genera()">GENERA IMMAGINE</button>

    <div id="imageContainer">
        <p id="stato" class="loading">L'intelligenza artificiale sta creando...</p>
        <img id="risultato" src="" alt="Immagine generata">
    </div>
</div>

<script>
    function genera() {
        const testo = document.getElementById('promptInput').value;
        const immagine = document.getElementById('risultato');
        const stato = document.getElementById('stato');

        if (!testo) {
            alert("Per favore, inserisci un testo!");
            return;
        }

        // Mostra caricamento
        stato.style.display = 'block';
        immagine.style.display = 'none';

        // Creazione link (usiamo il motore Flux per la massima qualità)
        const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(testo) + "?model=flux&width=1024&height=1024&seed=" + Math.random();

        immagine.src = url;

        // Quando l'immagine è pronta, mostrala
        immagine.onload = function() {
            stato.style.display = 'none';
            immagine.style.display = 'block';
        };
    }
</script>

</body>
</html>
