<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Generatore IA Definitivo</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #0f0; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .box { background: #111; border: 2px solid #0f0; padding: 20px; border-radius: 10px; width: 100%; max-width: 500px; text-align: center; }
        textarea { width: 100%; height: 60px; background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px; margin-bottom: 20px; box-sizing: border-box; }
        button { background: #0f0; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; width: 100%; }
        #loader { display: none; margin: 20px 0; color: white; }
        img { max-width: 100%; margin-top: 20px; border: 1px solid #fff; display: none; }
    </style>
</head>
<body>

<div class="box">
    <h2>IA IMAGE ENGINE 2.0</h2>
    <textarea id="testo" placeholder="SCRIVI IN INGLESE (es: blue dragon)"></textarea>
    <button id="bottone" onclick="genera()">GENERA ORA</button>
    
    <div id="loader">CARICAMENTO IN CORSO... ATTENDI 10 SECONDI</div>
    <img id="foto" src="">
</div>

<script>
    function genera() {
        const prompt = document.getElementById('testo').value;
        const img = document.getElementById('foto');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('bottone');

        if(!prompt) return alert("Scrivi qualcosa!");

        // Reset
        img.style.display = 'none';
        loader.style.display = 'block';
        btn.disabled = true;

        // Puliamo il testo per l'URL
        const cleanPrompt = encodeURIComponent(prompt.trim());
        const seed = Math.floor(Math.random() * 99999);

        // USIAMO UN LINK DIRETTO (meno probabile che venga bloccato)
        const nuovoUrl = `https://pollinations.ai/p/${cleanPrompt}?width=1024&height=1024&seed=${seed}&model=flux`;

        // Carichiamo l'immagine
        img.src = nuovoUrl;

        img.onload = function() {
            loader.style.display = 'none';
            img.style.display = 'block';
            btn.disabled = false;
        };

        img.onerror = function() {
            loader.innerText = "ERRORE CRITICO: Il tuo provider blocca l'IA.";
            btn.disabled = false;
        };
    }
</script>

</body>
</html>
