<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>IA Generator - Ultra Stabile</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #1a1a1a; padding: 30px; border-radius: 20px; width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        textarea { width: 100%; height: 100px; padding: 15px; border-radius: 10px; border: 1px solid #333; background: #252525; color: white; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; margin-top: 15px; padding: 15px; background: #ff4757; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:disabled { background: #555; cursor: not-allowed; }
        #imgArea { margin-top: 20px; border: 2px dashed #444; border-radius: 15px; min-height: 300px; display: flex; align-items: center; justify-content: center; position: relative; }
        img { max-width: 100%; border-radius: 12px; display: none; }
        .loader { display: none; color: #ffa502; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>Generatore IA Offline-Safe</h2>
    <textarea id="txt" placeholder="Scrivi in inglese per sicurezza (es: a futuristic car)"></textarea>
    <button id="go" onclick="faiImmagine()">GENERA ORA</button>

    <div id="imgArea">
        <p id="wait" class="loader">⚙️ L'IA sta creando l'immagine... attendi 10 secondi</p>
        <img id="pic" src="" alt="Risultato">
    </div>
</div>

<script>
    async function faiImmagine() {
        const prmt = document.getElementById('txt').value;
        const pic = document.getElementById('pic');
        const wait = document.getElementById('wait');
        const btn = document.getElementById('go');

        if (!prmt) return alert("Scrivi qualcosa!");

        // Reset
        btn.disabled = true;
        wait.style.display = 'block';
        pic.style.display = 'none';

        // URL del generatore (usiamo un altro gateway ancora)
        const seed = Math.floor(Math.random() * 9999);
        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prmt)}?model=flux&seed=${seed}&nologo=true`;

        // TECNICA DI SBLOCCO: Proviamo a "pre-scaricare" l'immagine come dati
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Server occupato");
            
            const blob = await response.blob();
            const objectURL = URL.createObjectURL(blob);
            
            pic.src = objectURL;
            pic.style.display = 'block';
            wait.style.display = 'none';
        } catch (err) {
            // Se fallisce, prova il metodo diretto come ultima spiaggia
            pic.src = url;
            pic.onload = () => {
                pic.style.display = 'block';
                wait.style.display = 'none';
            };
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
