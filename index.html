<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>IA Image Generator - Versione Stabile</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 15px; text-align: center; width: 400px; border: 1px solid #333; }
        textarea { width: 100%; height: 80px; padding: 10px; border-radius: 8px; border: none; font-size: 14px; margin-bottom: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #imageContainer { margin-top: 20px; min-height: 200px; display: flex; align-items: center; justify-content: center; border: 2px dashed #333; border-radius: 10px; overflow: hidden; }
        img { max-width: 100%; height: auto; display: none; }
        .status { color: #ffc107; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h3>Scrivi e Genera</h3>
    <textarea id="promptInput" placeholder="Esempio: Un gatto spaziale..."></textarea>
    <button id="btn" onclick="genera()">GENERA IMMAGINE</button>

    <div id="imageContainer">
        <p id="stato" class="status">L'IA sta lavorando... (circa 10-15 secondi)</p>
        <img id="risultato" src="" alt="Immagine">
    </div>
</div>

<script>
    function genera() {
        const testo = document.getElementById('promptInput').value;
        const immagine = document.getElementById('risultato');
        const stato = document.getElementById('stato');
        const bottone = document.getElementById('btn');

        if (!testo) return alert("Scrivi qualcosa!");

        // 1. Reset interfaccia
        bottone.disabled = true;
        bottone.innerText = "GENERAZIONE IN CORSO...";
        stato.style.display = 'block';
        immagine.style.display = 'none';

        // 2. Proviamo con il server Airforce (più veloce per il Web)
        const seed = Math.floor(Math.random() * 1000000);
        const url = `https://api.airforce/v1/imagestudio?prompt=${encodeURIComponent(testo)}&model=stable-diffusion-xl-v1.0&seed=${seed}`;

        // 3. Caricamento immagine
        immagine.src = url;

        immagine.onload = function() {
            stato.style.display = 'none';
            immagine.style.display = 'block';
            bottone.disabled = false;
            bottone.innerText = "GENERA IMMAGINE";
        };

        // 4. Se il primo server fallisce dopo 20 secondi, prova il secondo
        setTimeout(() => {
            if (immagine.style.display === 'none') {
                stato.innerText = "Cambio server in corso... attendi...";
                immagine.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(testo)}?model=flux&nologo=true`;
            }
        }, 15000);

        immagine.onerror = function() {
            stato.innerText = "Errore di connessione. Riprova.";
            bottone.disabled = false;
            bottone.innerText = "GENERA IMMAGINE";
        };
    }
</script>

</body>
</html>
